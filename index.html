<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css?v=20261004-430">
    <title>まちの朝市</title>
</head>
<body>
    <header>
        <div class="header-title">
            <img class="logo" src="assets/favicon.svg" alt="">
            <p>まちの朝市</p>
        </div>
        <div class="header-menu">
            <ul class="menu">
                <li><a href="#Store-opening-information">出店案内</a></li>
                <li><a href="#Event-information">開催情報</a></li>
            </ul>
        </div>
    </header>
    <main>
        <div class="intro">
            <div class="texts">
                <p class="subtitle">毎週土曜日の小さな朝市</p>
                <h1 class="intro-title">土曜の朝、<br>近くでいいものを。</h1>
                <p class="intro-text">野菜とパンと花に出会える、まちの小さな朝市です。</p>
                <a class="intro-button" href="#Store-opening-information">出店案内を見る</a>
            </div>
            <img class="intro-image" src="assets/market-basket.svg" alt="">
        </div>


        <div class="check">
            <h2 id="Store-opening-information">今週の出店</h2>
            <p>気になるお店を見つけてください。</p>
        </div>

    
        

        <div class="cards">
            <div class="card">
                <p class="number">01</p> 
                <h3>朝どれ野菜</h3>
                <p>近くの畑から届く<br>季節の野菜。</p>
            </div>
            <div class="card">
                <p class="number">02</p> 
                <h3>焼きたてパン</h3>
                <p>食卓に持ち帰りたい<br>香りのよいパン。</p>
            </div>
            <div class="card">
                <p class="number">03</p> 
                <h3>季節の花</h3>
                <p>一輪から選べる<br>色とりどりの花。</p>
            </div>
        </div>

        <div class ="Event-information">
            <h2 id="Event-information">開催情報</h2>
            <div class="event-details">
                <p class="event-time">毎週土曜日 9:00 - 12:00</p>
                <p class="event-place">みどり公園 東側広場</p>
            </div>
            
            
        </div>
    </main>
    <footer>
        <p>© まちの朝市</p>
    </footer>
</body>
</html>
